type User {
    id: ID!
    name: String!
    email: String!
    password: String
    tasks: [Task!]! @hasMany
}

type Query {
    user(id: ID!): User @field(resolver: "App\\GraphQL\\Queries\\UserQuery")
}

type Mutation {
    createUser(name: String!, email: String!, password: String!): User
        @field(resolver: "App\\GraphQL\\Mutations\\CreateUserMutation")
}
